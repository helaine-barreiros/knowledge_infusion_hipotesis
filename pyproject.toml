[project]
name = "knowledge-infusion-hipotesis-v2"
version = "0.1.0"
description = ""
authors = [
    {name = "Gabriel Rodrigues",email = "gabrielrlima@fitec.org.br"},
    {name = "Helaine Lins",email = "helaine.lins@upe.br" }
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "colorlog (>=6.9.0,<7.0.0)",
    "pypdf2 (>=3.0.1,<4.0.0)",
    "fitz (>=0.0.1.dev2,<0.0.2)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "pillow (>=11.1.0,<12.0.0)",
    "openai (>=1.70.0,<2.0.0)",
    "ollama (>=0.4.7,<0.5.0)",
    "requests (>=2.31.0,<3.0.0)",
    "xlsxwriter (>=3.2.2,<4.0.0)",
    "plantuml (>=0.3.0,<0.4.0)"
]

[tool.poetry]
packages = [{include = "src"}]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
