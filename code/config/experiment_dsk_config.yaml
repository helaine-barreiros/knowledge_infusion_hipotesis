  reference_puml_evaluator: "./config/AI-Powered-Analysis-Insights-System/use-case-reference.puml"
  reference_image_evaluator: "./config/AI-Powered-Analysis-Insights-System/use-case-reference.png"
  treatment_model_1: "Qwen-Coder-c1:latest"
  treatment_model_2: "Fin-R1-c1:latest"
  treatment_provider_1: "ollama"
  treatment_provider_2: "ollama"
  treatment_model_1_temperature: 0.4
  treatment_model_2_temperature: 0.4
  treatment_model_1_top_p: 0.95
  treatment_model_2_top_p: 0.95
  treatment_model_1_top_k: 80
  treatment_model_2_top_k: 40
  treatment_model_1_presence_penalty: 0.4
  treatment_model_2_presence_penalty: 0.6
  treatment_model_1_frequence_penalty: 0.2
  treatment_model_2_frequence_penalty: 0.4
  treatment_model_1_num_predict: 2048
  treatment_model_2_num_predict: 2048
  ollama_model: "Qwen-Coder-c1:latest"
  ollama_url: "https://utterly-driving-dodo.ngrok-free.app/api/chat"
  plantum_png_url: "http://www.plantuml.com/plantuml/png/"
  pipeline_processor: parallel
  system_prompt: |
    You are a specialized UML modeling assistant with expertise in software engineering and technical specification. Your primary function is to convert functional requirements into precise PlantUML use case diagrams.

    Technical guidelines:
    1. Use only valid PlantUML syntax
    2. Work within a left-to-right direction for readability
    3. Ensure actors are represented with their exact names from requirements
    4. Format use cases as <<ID: Name>> where ID matches requirement IDs (eg: usecase "SAFR001: Manage Analysis Parameters" as SAFR001)
    5. Be precise with actor-to-use-case relationships
    6. Identify inheritance relationships between actors if implied by requirements
    7. Group use cases logically by actor or subsystem
    8. Include a descriptive title in the diagram
    9. Avoid inventing actors or use cases not present in requirements
    10. Structure the PlantUML code with proper indentation
    11. Begin with @startuml and end with @enduml
    12. Use the 'rectangle' notation to define system boundaries
    13. Wrap the complete PlantUML code in a code block
    14. Actors (defined by actor keyword with alias (eg: usecase "CFR001: View" as CFR001)
    15. Use cases (declared by usecase keyword (eg: usecase "Wash" as W))
    16. Relationships relate actors and usecase (declared with arrow --> (eg: User -> (Start)), can apply labels (eg: User -> (Human) : label)), actor/usecase can extens another with  <|-- (eg:(Start) <|-- (Use)))
    17. Packages group actors ou usecases (eg: package Professional { actor Chef as c } )
    18. System boundary (represented as a rectangle (eg: rectangle Professional { actor Chef as c }))
    19. Do not forgett quotation marks when any definition have spaces (eg: usecase "CFR001: View Financial" as CFR001)
    20. the components name could not have the same identification.
    21. comments use a single quote (ex: 'my comment)
    22. wrap any text with a space character with double quotes (eg: lient --> CFR002 : "View Alerts")

    Here is an example:
    @startuml
    left to right direction

    title Use Case Diagram for AI-Powered Analysis & Insights System

    :Client: as Client
    :System: as Sys

    rectangle "System" {
      usecase "CFR001: View Financial Insights Dashboard" as CFR001
      usecase "SAFR001: Manage Analysis Parameters" as SAFR001
      
      Client --> CFR001
      SysAdmin --> SAFR001
    }
    @enduml
  user_prompt: |
    Generate a complete PlantUML use case diagram based on the following functional requirements list. The diagram must accurately represent all actors and use cases with their exact IDs and names as given in the requirements.

    Functional requirements:

    CFR001: As a Client, I want to view a financial insights dashboard that presents my financial data in a comprehensive format to better understand my overall financial health.
    CFR002: As a Client, I want to receive alerts about anomalous transactions in my accounts to quickly identify potential fraud or unusual spending patterns according to regulations set by the Financial Action Task Force (FATF).
    CFR003: As a Client, I want to view financial predictions based on my historical data and current market trends to make more informed financial decisions and plan for future expenses.
    CFR004: As a Client, I want to receive personalized recommendations aligned with my financial profile and goals to optimize my financial strategies and investment portfolio.
    CFR005: As a Client, I want to manage my personalized recommendations preferences to ensure the system provides insights relevant to my financial objectives and risk tolerance as defined in my KYC (Know Your Customer) profile.
    CFR006: As a Client, I want to view spending limit alerts when I exceed predefined thresholds in specific expense categories to maintain better control over my budget.
    CFR007: As a Client, I want to view investment opportunities suitable to my risk profile (as defined under MiFID II or equivalent standards) to diversify my portfolio and maximize returns.
    CFR008: As a Client, I want to view news related to my investment portfolio to stay informed about market events that might affect my assets.
    CFR009: As a Client, I want to access a personalized dashboard that consolidates my financial information in a single view to efficiently monitor my finances.
    CFR010: As a Client, I want to manage my relationship with Financial Advisors, including permissions for sharing my financial data, to maintain privacy and control over my financial information.
    SAFR001: As a System Administrator, I want to manage analysis parameters for the AI system to ensure the algorithms remain accurate, relevant, and compliant with financial regulations such as Basel III for risk management.
    FAFR001: As a Financial Advisor, I want to manage client mentoring sessions based on system-generated insights to provide more valuable guidance aligned with each client's financial goals.
    FAFR002: As a Financial Advisor, I want to view client intervention alerts when the system detects patterns requiring professional attention to proactively assist clients with potential financial issues.
    FAFR003: As a Financial Advisor, I want to view predictive analytics about my clients' financial situations to provide data-driven recommendations during consultations.
    FAFR004: As a Financial Advisor, I want to configure analysis parameters for specific client segments to customize the system's behavior according to different client profiles and regulatory requirements such as GDPR or CCPA.
    SFR001: As a system, I must deliver alerts to users through appropriate notification channels to ensure timely awareness of critical financial events.
    SFR002: As a system, I must deliver personalized recommendations to users based on their financial profiles to support better financial decision-making.
    SFR003: As a system, I must request financial predictions from the AI component to provide users with forward-looking financial insights.
    SFR004: As a system, I must request personalized recommendations from the AI component based on each user's financial data and preferences.
    SFR005: As a system, I must request spending limit alerts from the AI component when user spending patterns exceed defined thresholds.
    SFR006: As a system, I must request investment opportunity analysis from the AI component to identify suitable investments for users based on their risk profiles.
    SFR007: As a system, I must request specific investment opportunities from the AI component that match user investment criteria and ESG (Environmental, Social, and Governance) preferences.
    SFR008: As a system, I must request anomaly transaction alerts from the AI component to detect potentially fraudulent activities in accordance with AML (Anti-Money Laundering) regulations.
    SFR009: As a system, I must find contextualized news relevant to users' financial portfolios from trusted financial news sources.
    SFR010: As a system, I must process contextualized news to extract relevant information for users' financial situations.
    SFR011: As a system, I must request contextualized news insights from the AI component to identify potential impacts on users' investments.
    SFR012: As a system, I must generate client dashboards that present financial information in an intuitive and actionable format.
    SFR013: As a system, I must generate client alerts based on predefined conditions to ensure timely notification of important financial events.
    SFR014: As a system, I must generate client analytics that provide meaningful insights into financial behavior and performance.
    SFR015: As a system, I must request predictive intervention analyses from the AI component to identify when financial advisors should engage with clients.
    SFR016: As a system, I must request predictive insights from the AI component to enhance the value of financial guidance provided to clients.
    SFR017: As a system, I must generate financial health reports that assess users' overall financial wellbeing according to standard financial ratios and metrics.
    SFR018: As a system, I must manage users' financial goals to track progress and provide relevant recommendations.
    SFR019: As a system, I must maintain a historical record of users' insights to enable trend analysis and effectiveness measurement.
    SFR020: As a system, I must manage user feedback to continuously improve the quality and relevance of financial insights.
    AIFR001: As an AI system, I must generate financial predictions for users by analyzing historical transaction data, market trends, and economic indicators.
    AIFR002: As an AI system, I must generate personalized recommendations for users based on their financial profiles, goals, and risk tolerance as defined by industry standards like FINRA guidelines.
    AIFR003: As an AI system, I must generate spending limit alerts for users by identifying unusual deviations from established spending patterns.
    AIFR004: As an AI system, I must generate investment opportunity analyses for users by evaluating potential investments against their risk profiles, time horizons, and financial goals.
    AIFR005: As an AI system, I must generate investment opportunities for users by identifying financial instruments that align with their investment strategies and Modern Portfolio Theory principles.
    AIFR006: As an AI system, I must generate anomaly transaction alerts by employing pattern recognition to detect potentially fraudulent activities in compliance with FinCEN requirements.
    AIFR007: As an AI system, I must generate contextualized news insights by correlating financial news with specific user portfolios to identify relevant impacts.
    AIFR008: As an AI system, I must generate client predictive intervention recommendations by identifying patterns that indicate potential financial difficulties or opportunities requiring advisor engagement.
    AIFR009: As an AI system, I must generate client predictive insights that provide forward-looking analysis of financial situations to support more effective financial planning.
    CFR011: As a User (Client, Financial Advisor, or System Administrator), I want to send feedback about the system's recommendations and insights to help improve the accuracy and relevance of future outputs.
