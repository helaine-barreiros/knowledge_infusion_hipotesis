  treatment_provider_2: "ollama"
  treatment_model_1_temperature: 1.5
  treatment_model_2_temperature: 1.5
  treatment_model_1_top_p: 0.7
  treatment_model_2_top_p: 0.7
  treatment_model_1_num_predict: 2048
  treatment_model_2_num_predict: 2048
  ollama_model: "Qwen-Coder-c1:latest"
  ollama_url: " https://faa2-200-133-1-77.ngrok-free.app/api/chat"
  plantum_png_url: "http://www.plantuml.com/plantuml/png/"
  pipeline_processor: parallel
  system_prompt: "you are a experiment software architect, proficient in the language PlantUML, use case diagrams and architectural approach 'C4 Modeling'. You are specialist in Financial business and must model a new system: 'AI-Powered Personal Financial Management System'."
  user_prompt: |
    Develop a use case diagram in PlantUML for the "AI-powered Personal Financial Management System" following the guidelines below:
    ## General guidelines:
    1. Use standard UML notation for use cases, not C4 notation. External systems should be represented as actors in the diagram.
    2. Organize the diagram into functional packages to improve readability (e.g., "Authentication", "Financial Management", "Analysis and Recommendations", "Planning", "Collaboration").
    3. Create 20-30 core use cases that represent complete functionality. A use case can implement multiple related functional requirements.
    4. Use UML relationships correctly: <<include>> for functionality that is always performed as part of the base use case <<extend>> for optional conditional functionality generalization for specialized cases of a more generic use case
    5. Represent both human users and external systems as actors, visually differentiating them.
    6. The use cases must correctly represent the functionalities of the system and follow the PlantUML syntax. See the provided example in ###Use Case Example.
    7. The diagram should be consistent with C1 Specification and Requirements, maintaining uniform terminology.
    8. All functional requirements must be covered, with adequate detail.
    9. The diagram should be clear enough to guide implementation by development teams.
    10. Return only the PlantUML code between the @startuml and @enduml tags in your response
    
    ### "AI-powered Personal Financial Management System" C1 Specification

    @startuml "AI-Enhanced Personal Finance Management System - Context Diagram"
    !include https://raw.githubusercontent.com/plantuml-stdlib/C4-PlantUML/master/C4_Context.puml
    'Define SPRITE for custom icons
    !define FONTAWESOME https://raw.githubusercontent.com/tupadr3/plantuml-icon-font-sprites/master/font-awesome-5
    !include FONTAWESOME/users.puml
    !include FONTAWESOME/user_tie.puml
    !include FONTAWESOME/server.puml
    !include FONTAWESOME/brain.puml
    !include FONTAWESOME/newspaper.puml
    !include FONTAWESOME/university.puml
    !include FONTAWESOME/chart_line.puml
    !include FONTAWESOME/lock.puml

    'Define custom colors
    !define CUSTOMER_COLOR #08427B
    !define SYSTEM_COLOR #1168BD
    !define EXTERNAL_SYSTEM_COLOR #999999

    LAYOUT_WITH_LEGEND()

    'Persons / Actors
    Person(individual, "Individual Customer", "A person who wants to manage their personal finances and receive financial insights", $sprite="users")

    Person(advisor, "Financial Advisor", "Professional who provides financial advice based on customer data", $sprite="user_tie")
    'Main System
    System(pfm_system, "AI-Enhanced Personal Finance Management System", "Provides financial aggregation, analysis, visualization, and AI-powered recommendations to help users manage their finances effectively", $sprite="server")

    'External Systems
    System_Ext(banking_api, "Banking APIs", "External services that provide secure access to users' bank accounts and transactions", $sprite="university")
    System_Ext(investment_api, "Investment APIs", "External services that provide market data and investment portfolio information", $sprite="chart_line")
    System_Ext(credit_service, "Credit Scoring Service", "Provides credit score information and assessment", $sprite="server")
    System_Ext(news_service, "Financial News Service", "Provides relevant financial news and economic indicators", $sprite="newspaper")
    System_Ext(auth_service, "Authentication Service", "Handles user authentication through various methods", $sprite="lock")

    System_Ext(ai_engine, "AI Reasoning Engine", "Provides advanced financial reasoning and predictive capabilities", $sprite="brain")

    'Relationships - Individual Customer
    Rel(individual, pfm_system, "Views financial information, receives insights, manages budgets and goals")

    'Relationships - Financial Advisor
    Rel(advisor, pfm_system, "Accesses shared customer financial data and provides recommendations")

    'Relationships - PFM System to External Systems
    Rel(pfm_system, banking_api, "Retrieves banking transactions, account balances, and account information")
    Rel(pfm_system, investment_api, "Fetches investment data, portfolio performance, and market information")
    Rel(pfm_system, credit_service, "Obtains credit scores and credit-related insights")
    Rel(pfm_system, news_service, "Receives relevant financial news and market updates")
    Rel(pfm_system, auth_service, "Verifies user identities and manages authentication")
    Rel(pfm_system, ai_engine, "Leverages for advanced financial analysis and personalized recommendations")

    'Feedback Relationships
    Rel(banking_api, pfm_system, "Sends transaction notifications and account updates")
    Rel(pfm_system, individual, "Sends notifications about financial alerts, insights, and goal progress")
    @enduml
    ```
    
    ### "AI-powered Personal Financial Management System" Functional Requirements
    | ID   | Requirement                                                                           | Priority  |
    | ---- | ------------------------------------------------------------------------------------- | --------- |
    | FR01 | The system shall authenticate users via username/password and OAuth2 providers        | Essential |
    | FR02 | The system shall connect to users' financial accounts through secure banking APIs     | Essential |
    | FR03 | The system shall aggregate and categorize financial transactions                      | Essential |
    | FR04 | The system shall visualize spending patterns and financial history                    | Essential |
    | FR05 | The system shall provide AI-powered insights on spending habits                       | Essential |
    | FR06 | The system shall generate personalized financial recommendations                      | Essential |
    | FR07 | The system shall allow users to set and track financial goals                         | Important |
    | FR08 | The system shall provide budget creation and monitoring capabilities                  | Important |
    | FR09 | The system shall deliver alerts for unusual spending patterns                         | Important |
    | FR10 | The system shall forecast future financial positions based on historical data         | Important |
    | FR11 | The system shall suggest investment opportunities based on user profile               | Important |
    | FR12 | The system shall provide debt management strategies with repayment simulations        | Important |
    | FR13 | The system shall allow users to share selected financial data with financial advisors | Desirable |
    | FR14 | The system shall provide a chatbot for financial queries                              | Desirable |
    | FR15 | The system shall generate periodic financial health reports                           | Desirable |
    | FR16 | The system shall offer cryptocurrency portfolio tracking and analysis                 | Desirable |
    
    ### "AI-powered Personal Financial Management System" Non-Functional Requirements
    | ID    | Requirement                                                                       | Priority  |
    | ----- | --------------------------------------------------------------------------------- | --------- |
    | NFR01 | The system shall comply with financial data regulations (GDPR, PSD2, etc.)        | Essential |
    | NFR02 | The system shall secure all financial data with encryption at rest and in transit | Essential |
    | NFR03 | The system shall maintain 99.9% uptime during business hours                      | Essential |
    | NFR04 | The system shall respond to user interactions within 1 second                     | Essential |
    | NFR05 | The system shall scale to handle at least 100,000 concurrent users                | Important |
    | NFR06 | The system shall provide multi-factor authentication                              | Important |
    | NFR07 | The system shall recover from failures within 5 minutes                           | Important |
    | NFR08 | The system shall support internationalization and multiple currencies             | Important |
    | NFR09 | The AI components shall be explainable and provide reasoning for recommendations  | Important |
    | NFR10 | The system shall be compatible with major web browsers and mobile devices         | Important |
    | NFR11 | The system shall maintain an audit trail of all data access                       | Important |
    | NFR12 | The system shall allow customization of dashboards and reports                    | Desirable |
    | NFR13 | The system shall support offline mode with limited functionality                  | Desirable |
    | NFR14 | The system shall be accessible according to WCAG 2.1 level AA standards           | Desirable |
    
    
    ###Use Case Example

    @startuml "AI-Enhanced Personal Financial Management System - Use Cases"

    title "AI-Enhanced Personal Financial Management System - Use Cases"

    ' ACTOR DEFINITION
    ' Syntax: actor "Display Name" as alias_name [#optional_color]
    ' Human actors are represented without color
    actor "Individual Customer" as user
    actor "Financial Advisor" as advisor

    ' System actors (external systems) should use color to differentiate 
    actor "Banking System" as bank #lightblue
    actor "Investment System" as invest #lightblue
    actor "AI Engine" as ai #lightgreen

    ' PACKAGE DEFINITION
    ' Syntax: package "Package Name" { ... use cases ... }
    ' Use packages to group related use cases
    package "Authentication & Security" {
        ' USE CASE DEFINITION
        ' Syntax: usecase "UC##: Use Case Name" as alias
        usecase "UC01: Authenticate User" as UC01
        
        ' NOTES - Add requirements traceability and descriptions
        ' Syntax: note [position] of [element]
        note right of UC01
          **Req. ID:** FR01, NFR06
          **Description:** Allows users to authenticate via 
          username/password or OAuth2 providers, with 
          optional multi-factor authentication.
        end note
        
        usecase "UC02: Manage Account Settings" as UC02
    }

    package "Financial Account Management" {
        usecase "UC03: Connect Financial Accounts" as UC03
        
        note right of UC03
          **Req. ID:** FR02
          **Description:** Securely links external financial accounts 
          using banking APIs to retrieve transaction data.
        end note
        
        usecase "UC04: View Transactions" as UC04
        usecase "UC05: Categorize Transactions" as UC05
        
        ' INCLUDE RELATIONSHIP
        ' Syntax: base_case ..> included_case : <<include>>
        ' Used when a base use case ALWAYS includes the functionality of another use case
        UC03 ..> UC04 : <<include>>
        
        ' EXTEND RELATIONSHIP
        ' Syntax: extending_case ..> base_case : <<extend>>
        ' Used when functionality is OPTIONALLY added to a base use case
        UC04 ..> UC05 : <<extend>>
    }

    package "Analysis & Insights" {
        usecase "UC06: View Financial Dashboard" as UC06
        usecase "UC07: Receive AI Insights" as UC07
        
        ' GENERALIZATION RELATIONSHIP
        ' Syntax: specific_case --|> general_case
        ' Used when one use case is a specialized version of a more general one
        usecase "UC08: View Basic Reports" as UC08
        usecase "UC09: View Advanced Analytics" as UC09
        UC09 --|> UC08
    }

    ' CROSS-PACKAGE RELATIONSHIPS
    ' Use cases can have relationships across different packages
    UC06 ..> UC04 : <<include>>

    ' ACTOR-USE CASE RELATIONSHIPS
    ' Syntax: actor --> usecase
    ' Shows which actors interact with which use cases
    user --> UC01
    user --> UC03
    user --> UC06
    advisor --> UC09
    bank --> UC03
    ai --> UC07

    ' LAYOUT HINTS
    ' Use these commands if you need to adjust the layout
    ' left to right direction
    ' top to bottom direction

    @enduml

